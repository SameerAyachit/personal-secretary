[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secretary"
version = "0.2.0"
description = "Native Windows personal secretary desktop app (PySide6 + SQLite + OpenAI-compatible LLM)"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sameer Ayachit" }]
dependencies = [
    "PySide6>=6.5,<7",
    "httpx>=0.27,<1",
    "dateparser>=1.5,<2",
    "python-dateutil>=2.8,<3",
    "tzdata>=2024,<2027",
    "tiktoken>=0.5,<1",
    "keyring>=24,<27",
    "desktop-notifier>=5,<7",
    "pydantic>=2.0,<3",
    "ddgs>=9,<10",
    "trafilatura>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-qt>=4,<5",
    "pytest-asyncio>=0.23,<2",
    "respx>=0.20,<1",
    "time-machine>=2,<4",
    "hypothesis>=6,<7",
]
quality = [
    "ruff>=0.8,<1",
    "mypy>=1.11,<3",
    "import-linter>=2,<3",
    "pre-commit>=3,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ui: tests that exercise the Qt UI (run with QT_QPA_PLATFORM=offscreen)",
]
addopts = ["-q"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "PLC", "PLE", "PLW", "RET", "RUF", "SIM", "TCH", "TRY"]
ignore = ["E501", "B008", "B018", "BLE001", "C408", "UP007", "UP008", "PLR0913", "PLR0915", "PLR2004", "SIM108", "SIM114", "TRY300", "TRY301", "TRY003", "TC001", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["secretary"]

[tool.mypy]
python_version = 3.12
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true
follow_imports = "silent"
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_packages = ["secretary"]
ignore_suggested_present = false
ignore_missing_modules = true

[[tool.importlinter.contracts]]
type = "forbidden"
name = "ui does not import lower layers directly"
allow_indirect_imports = true
source_modules = ["secretary.ui"]
forbidden_modules = [
    "secretary.agent",
    "secretary.tools",
    "secretary.store",
    "secretary.integrations",
    "secretary.llm",
    "secretary.timeparse",
    "secretary.notify",
    "secretary.scheduler",
    "secretary.config",
    "secretary.paths",
    "secretary.secrets",
    "secretary.logging_setup",
    "secretary.app",
]

[[tool.importlinter.contracts]]
type = "forbidden"
name = "controller does not import ui or app"
allow_indirect_imports = true
source_modules = ["secretary.controller"]
forbidden_modules = ["secretary.ui", "secretary.app"]

[[tool.importlinter.contracts]]
type = "forbidden"
name = "agent does not import ui, controller, or app"
allow_indirect_imports = true
source_modules = ["secretary.agent"]
forbidden_modules = ["secretary.ui", "secretary.controller", "secretary.app"]

[[tool.importlinter.contracts]]
type = "forbidden"
name = "tools does not import ui, controller, agent, or app"
allow_indirect_imports = true
source_modules = ["secretary.tools"]
forbidden_modules = ["secretary.ui", "secretary.controller", "secretary.agent", "secretary.app"]

[[tool.importlinter.contracts]]
type = "forbidden"
name = "store imports nothing"
allow_indirect_imports = true
source_modules = ["secretary.store"]
forbidden_modules = [
    "secretary.ui", "secretary.controller", "secretary.agent", "secretary.tools",
    "secretary.integrations", "secretary.llm", "secretary.timeparse", "secretary.notify",
    "secretary.scheduler", "secretary.config", "secretary.paths", "secretary.secrets",
    "secretary.logging_setup", "secretary.app",
]

[[tool.importlinter.contracts]]
type = "forbidden"
name = "secrets imports nothing"
allow_indirect_imports = true
source_modules = ["secretary.secrets"]
forbidden_modules = [
    "secretary.ui", "secretary.controller", "secretary.agent", "secretary.tools",
    "secretary.store", "secretary.integrations", "secretary.llm", "secretary.timeparse",
    "secretary.notify", "secretary.scheduler", "secretary.config", "secretary.paths",
    "secretary.secrets", "secretary.logging_setup", "secretary.app",
]

[[tool.importlinter.contracts]]
type = "forbidden"
name = "logging_setup imports nothing"
allow_indirect_imports = true
source_modules = ["secretary.logging_setup"]
forbidden_modules = [
    "secretary.ui", "secretary.controller", "secretary.agent", "secretary.tools",
    "secretary.store", "secretary.integrations", "secretary.llm", "secretary.timeparse",
    "secretary.notify", "secretary.scheduler", "secretary.config", "secretary.paths",
    "secretary.secrets", "secretary.logging_setup", "secretary.app",
]

