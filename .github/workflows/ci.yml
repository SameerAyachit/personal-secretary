name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install Qt offscreen deps
        run: |
          # Qt_QPA_PLATFORM=offscreen needs no display on Windows CI runners

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Run import-linter
        run: lint-imports
